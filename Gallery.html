<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - mohitkumarsharma</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ===== Gallery Section ===== */
.gallery-section {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    margin-top: 20px;
}
.gallery-grid img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.3s;
}
.gallery-grid img:hover {
    transform: scale(1.05);
}

/* ===== Lightbox ===== */
.lightbox {
    display: none;
    position: fixed;
    z-index: 1000;
    padding-top: 60px;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background: rgba(0,0,0,0.9);
}
.lightbox-content {
    display: block;
    margin: auto;
    max-width: 90%;
    max-height: 80%;
}
.close {
    position: absolute;
    top: 20px;
    right: 35px;
    color: white;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>
<body>

<!-- ===== Navigation ===== -->
<nav>
    <ul>
        <li><a href="Home.html" >Home</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="achievements.html">Achievements</a></li>
        <li><a href="certificates.html">certificates</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<!-- ===== Gallery Section ===== -->
<div class="gallery-section">
    <h2>Photo Gallery</h2>
    <p>Some memorable moments captured.</p>

    <div class="gallery-grid">
        <img src="gallary/photo1.jpeg" alt="photo1">
        <img src="gallary/photo2.jpeg" alt="photo2">
        <img src="gallary/photo3.jpeg" alt="photo3">
        <img src="gallary/photo4.jpeg" alt="photo4">
        <img src="gallary/photo5.jpeg" alt="photo5">
        <img src="gallary/photo6.jpeg" alt="photo6">
        <img src="gallary/photo7.jpg" alt="photo7">
        <img src="gallary/photo8.jpg" alt="photo8">
        <img src="gallary/photo9.jpeg" alt="photo9">
        
    </div>
</div>

<!-- ===== Lightbox ===== -->
<div id="lightbox" class="lightbox">
    <span class="close" id="closeBtn">&times;</span>
    <img class="lightbox-content" id="lightboxImg">
</div>

<!-- ===== Footer ===== -->
<footer>
    <p>© 2025 My Portfolio | Designed by Mohit Kumar sharma</p>
</footer>

<!-- ===== JavaScript for Lightbox ===== -->
<script>
const images = document.querySelectorAll('.gallery-grid img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const closeBtn = document.getElementById('closeBtn');

images.forEach(img => {
    img.addEventListener('click', () => {
        lightbox.style.display = 'block';
        lightboxImg.src = img.src;
    });
});

closeBtn.addEventListener('click', () => {
    lightbox.style.display = 'none';
});

lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
        lightbox.style.display = 'none';
    }
});
</script>

</body>
</html>
